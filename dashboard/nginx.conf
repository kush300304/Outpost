# @file nginx.conf
# Serves the dashboard on port 8090 and proxies /router, /edge1..3 and /origin-admin to the services,
# plus storage's read-only /debug/stats, so the page needs no CORS. The raw request URI is forwarded (keys stay percent-encoded), and service
# names are re-resolved through Docker's DNS so restarted containers are found again.

map $request_uri $proxiedPath {
    ~^/(router|edge1|edge2|edge3)(?<rest>/.*)$ $rest;
    ~^/origin-admin(?<rest>/.*)$ /admin$rest;
    default /;
}

server {
    listen 8090;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 1s;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 2s;
    proxy_read_timeout 6s;
    proxy_send_timeout 6s;

    # The page and its scripts are revalidated on every load (a cheap 304 when unchanged), so a browser
    # never runs an old script against a newer page after the dashboard is rebuilt.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /router/ {
        set $target router:8080;
        proxy_pass http://$target$proxiedPath;
    }

    location /edge1/ {
        set $target edge-1:8081;
        proxy_pass http://$target$proxiedPath;
    }

    location /edge2/ {
        set $target edge-2:8082;
        proxy_pass http://$target$proxiedPath;
    }

    location /edge3/ {
        set $target edge-3:8083;
        proxy_pass http://$target$proxiedPath;
    }

    location /origin-admin/ {
        set $target write-api:9090;
        proxy_pass http://$target$proxiedPath;
    }

    # Only storage's statistics; its /key routes stay unreachable from outside the compose network.
    location = /storage/debug/stats {
        set $target storage:9091;
        proxy_pass http://$target/debug/stats;
    }
}
